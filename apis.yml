name: Feetme
description: 'FeetMe is a Paris-based medical device company, founded in 2013, that
  develops smart connected insoles and digital health software for real-time gait
  analysis and mobility care. Its CE-marked, ISO 13485 and ISO 9001 certified wearables
  embed plantar pressure sensors and a 6-axis inertial measurement unit to capture
  more than twenty gait and balance metrics per step, streaming them over Bluetooth
  Low Energy to the FeetMe Mobility dashboard used by clinicians for neurological,
  orthopedic and rehabilitation assessment. Product lines include FeetMe Evaluation,
  FeetMe Rehabilitation, FeetMe Monitor and FeetMe Stimulate. The company is backed
  by Partech. FeetMe does not currently expose a public developer API or OpenAPI-described
  web API; a partner SDK for raw-data integration is referenced in product materials
  but is not publicly documented.'
